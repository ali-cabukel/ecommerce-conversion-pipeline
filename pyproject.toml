[project]
name = "ecommerce-conversion-pipeline"
version = "0.1.0"
description = "Real-time e-commerce conversion prediction demo on Olist data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bentoml>=1.3",
    "dbt-postgres>=1.8",
    "evidently>=0.7",
    "feast[postgres,redis]>=0.41",
    "joblib>=1.4",
    "kafka-python>=2.0",
    "mlflow>=2.16",
    "numpy>=2.0",
    "pandas>=2.2",
    "prometheus-client>=0.21",
    "psycopg2-binary>=2.9",
    "psycopg[binary]>=3.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = [
    "monitoring",
    "serving",
    "streaming",
    "training",
    "warehouse",
]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
skips = ["B101"]

[tool.ruff.lint.per-file-ignores]
"training/dataset.py" = ["E402"]
"training/train.py" = ["E402"]
"warehouse/load_raw.py" = ["E402"]
"streaming/replay/replay_events.py" = ["E402"]
"streaming/consumer/session_features.py" = ["E402"]
"streaming/publish_session.py" = ["E402"]
"monitoring/drift.py" = ["E402"]
