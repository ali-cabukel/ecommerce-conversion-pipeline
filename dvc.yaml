# DVC pipeline — stages will be implemented incrementally.
#
# Planned flow (orchestrated by Airflow DAG conversion_batch_training):
#   ingest → dbt_features → feast_materialize → train → export_bentoml

stages:
  ingest:
    cmd: python training/dataset.py
    deps:
      - training/dataset.py
      - training/config.py
      - data/raw
    outs:
      - data/processed/sessions.parquet
      - data/processed/sessions_meta.json

  train:
    cmd: python training/train.py
    deps:
      - training/train.py
      - training/dataset.py
      - training/config.py
      - data/processed/sessions.parquet
    outs:
      - models/conversion_model.joblib
      - models/metrics.json
      - models/feature_names.json
